services:
  - type: web
    name: cozy-hotel
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: ADMIN_DASHBOARD_TOKEN
        sync: false
      - key: ADMIN_ACTOR_ID
        sync: false
      - key: CITY_GAME_SECRET
        generateValue: true
      - key: DISCORD_CLIENT_SECRET
        sync: false
