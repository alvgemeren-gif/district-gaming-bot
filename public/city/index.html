<!doctype html>
<html lang="nl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="theme-color" content="#07111f">
	<title>City League</title>
	<link rel="stylesheet" href="/city/app.css">
	<link rel="stylesheet" href="/city/teams.css">
</head>
<body>
	<div class="sky"></div>
	<header id="header" hidden>
		<a class="brand" href="/city"><span>CL</span><div><b>CITY LEAGUE</b><small>TEAM SIMULATION</small></div></a>
		<div class="team-pill"><small>JOUW TEAM</small><b id="teamName">—</b></div>
		<div class="status" id="connection">VERBINDEN…</div>
	</header>
	<nav id="nav" hidden>
		<button data-page="city" class="active">STAD</button>
		<button data-page="research">ONDERZOEK</button>
		<button data-page="ranking">RANGLIJST</button>
		<button data-page="profile">PROFIEL</button>
	</nav>
	<main id="app">
		<section class="center"><div class="loader"></div><h1>City League laden…</h1></section>
	</main>
	<div id="toast" role="status"></div>

	<template id="startPage">
		<section class="welcome">
			<div class="welcome-copy">
				<p class="kicker">NIEUWE CITY-SIMULATIE</p>
				<h1>BOUW SAMEN.<br><em>WIN ALS TEAM.</em></h1>
				<p>Kies één van de vijf districtteams en start direct. Er is geen account of Discord-login nodig.</p>
				<div class="features"><span>🏙 Bouw je stad</span><span>⚡ Verzamel grondstoffen</span><span>🏆 Klim als team</span></div>
			</div>
			<form id="teamForm" class="start-card">
				<div class="step">01</div>
				<p class="kicker">VOORDAT JE BEGINT</p>
				<h2>Kies jouw district</h2>
				<div class="team-options" id="teamOptions"><div class="loader small"></div></div>
				<p class="hint">Je stad verzamelt automatisch punten voor het gekozen districtteam.</p>
				<p class="error" id="startError" hidden></p>
				<button class="primary" type="submit">START DE SIMULATIE →</button>
			</form>
		</section>
	</template>

	<template id="cityPage">
		<section class="hero">
			<div><p class="kicker" id="district">TEAM</p><h1 id="cityName">Mijn stad</h1><p>Level <b id="level">1</b> · <b id="power">0</b> teampunten</p></div>
			<button id="daily" class="primary" data-action="daily">DAGELIJKSE BONUS</button>
		</section>
		<section class="resources" id="resources"></section>
		<div class="section-title"><div><p class="kicker">BOUWTERREIN</p><h2>Breid je stad uit</h2></div><span id="queue">BOUWVAKKERS BESCHIKBAAR</span></div>
		<section class="building-grid" id="buildings"></section>
	</template>

	<template id="researchPage">
		<section class="page-head"><p class="kicker">INNOVATIE</p><h1>Onderzoek</h1><p>Ontgrendel permanente voordelen voor jouw stad.</p></section>
		<section class="list" id="researchList"></section>
	</template>

	<template id="rankingPage">
		<section class="page-head"><p class="kicker">LIVE STAND</p><h1>Teamranglijst</h1><p>Alle steden met dezelfde teamnaam tellen samen mee.</p></section>
		<section class="list" id="rankingList"></section>
	</template>

	<template id="profilePage">
		<section class="page-head profile-head"><div><p class="kicker">JOUW VOORTGANG</p><h1 id="profileCity">Mijn stad</h1></div><a href="/city/logout" class="secondary">ANDER TEAM</a></section>
		<section class="profile-grid"><div><small>STADSLEVEL</small><b id="profileLevel">1</b></div><div><small>TEAMKRACHT</small><b id="profilePower">0</b></div><div><small>PRESTATIES</small><b id="profileAchievements">0</b></div></section>
		<section class="list" id="achievementList"></section>
	</template>
	<script src="/city/app.js" defer></script>
</body>
</html>
