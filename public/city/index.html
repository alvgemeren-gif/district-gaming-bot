<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#090b16"><title>District Dominion</title><link rel="stylesheet" href="/city/app.css">
</head>
<body>
	<div class="aurora a"></div><div class="aurora b"></div>
	<header class="game-chrome">
		<div class="brand"><span class="brandmark">D</span><span><b>DISTRICT<br>DOMINION</b><small>GAMING DISTRICT</small></span></div>
		<div class="season"><small>SEASON 01</small><b>43D : 08H : 21M</b></div>
		<div class="profile"><div><span id="player">CONNECTING</span><small class="connection" id="connection">SYNCING</small></div><img id="avatar" alt=""></div>
	</header>
	<nav class="game-chrome"><button class="active" data-view="city">CITY</button><button data-view="research">RESEARCH</button><button data-view="district">DISTRICT</button><button data-view="profile">PROFILE</button></nav>
	<main id="app">
		<section class="loading"><div class="spinner"></div><h2>SYNCING CITY</h2><p>Contacting district command…</p></section>
	</main>
	<div id="toast" role="status"></div>
	<template id="loginView">
		<section class="login-shell">
			<div class="login-art"><span class="login-logo">D</span><p>DISTRICT NETWORK // SECURE ACCESS</p></div>
			<div class="login-card">
				<p class="eyebrow">WELCOME, COMMANDER</p><h1>YOUR CITY<br>AWAITS.</h1>
				<p class="login-copy">Log in with Discord. We only use your profile to verify your username, avatar and permanent district role.</p>
				<p class="login-error" id="loginError" hidden></p>
				<a class="discord-login" href="/city/auth"><span>◖◗</span> CONTINUE WITH DISCORD</a>
				<div class="login-points"><span>✓ No password shared</span><span>✓ District verified</span><span>✓ Secure session</span></div>
				<small>You must be a member of the Gaming District Discord server and already have a district.</small>
			</div>
		</section>
	</template>
	<template id="cityView">
		<section class="hero-panel">
			<div><p class="eyebrow" id="districtLabel">DISTRICT</p><h1 id="cityName">Your City</h1><p>City level <b id="cityLevel">1</b> · <span id="cityPower">0</span> district power</p></div>
			<button class="daily" id="daily">CLAIM SUPPLY DROP <small>DAILY REWARD</small></button>
		</section>
		<section class="resources" id="resources"></section>
		<section class="section-head"><div><p class="eyebrow">CITY GRID</p><h2>Build your empire</h2></div><span id="queue">BUILD QUEUE READY</span></section>
		<section class="building-grid" id="buildings"></section>
	</template>
	<template id="researchView"><section class="page-title"><p class="eyebrow">PERMANENT UPGRADES</p><h1>Research network</h1><p>Discover technology that transforms every part of your city.</p></section><section class="research-list" id="researchList"></section></template>
	<template id="districtView"><section class="page-title"><p class="eyebrow">LIVE RANKINGS</p><h1>District command</h1><p>Every citizen, building and discovery moves your district forward.</p></section><section class="leaderboard" id="leaderboard"></section></template>
	<template id="profileView"><section class="page-title profile-title"><div><p class="eyebrow">COMMANDER PROFILE</p><h1 id="profileCity">Your City</h1></div><a class="logout" href="/city/logout">LOG OUT</a></section><section class="profile-grid"><div class="stat-card"><small>CITY LEVEL</small><b id="pLevel">1</b></div><div class="stat-card"><small>DISTRICT POWER</small><b id="pPower">0</b></div><div class="stat-card"><small>ACHIEVEMENTS</small><b id="pAchievements">0</b></div></section><section class="achievements" id="achievements"></section></template>
	<script src="/city/app.js" defer></script>
</body></html>
