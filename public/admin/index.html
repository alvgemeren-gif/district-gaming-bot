<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Gaming District · Moderation</title>
	<link rel="stylesheet" href="/admin/app.css">
</head>
<body>
	<header>
		<div>
			<p class="eyebrow">GAMING DISTRICT</p>
			<h1>Match moderation</h1>
		</div>
		<div class="filters">
			<select id="guild" aria-label="Discord server"></select>
			<select id="status" aria-label="Status">
				<option value="pending">Pending</option>
				<option value="all">All</option>
				<option value="approved">Approved</option>
				<option value="rejected">Rejected</option>
			</select>
			<button class="quiet" id="refresh">Refresh</button>
		</div>
	</header>
	<main>
		<section class="summary">
			<div><span id="total">0</span><small>visible</small></div>
			<div><span id="pending">0</span><small>pending</small></div>
			<p id="message" role="status"></p>
		</section>
		<section id="submissions" class="grid"></section>
		<div id="empty" class="empty" hidden>No submissions found.</div>
	</main>
	<template id="card">
		<article class="card">
			<div class="card-head">
				<div><p class="submission-id"></p><h2 class="player"></h2></div>
				<span class="badge"></span>
			</div>
			<img class="proof" alt="Submitted Victory Royale evidence" hidden>
			<div class="facts">
				<div><small>District</small><strong class="district"></strong></div>
				<div><small>Submitted kills</small><strong class="submitted-kills"></strong></div>
				<div><small>Claimed victory</small><strong class="claimed-win"></strong></div>
				<div><small>Detection</small><strong class="detection"></strong></div>
				<div><small>Submitted</small><strong class="date"></strong></div>
			</div>
			<div class="decision">
				<label>Kills<input class="kills" type="number" min="0" max="100"></label>
				<label class="check"><input class="victory" type="checkbox"> Victory Royale (+10)</label>
				<label class="note-label">Note<input class="note" maxlength="500" placeholder="Optional"></label>
				<div class="actions">
					<button class="reject">Reject</button>
					<button class="approve">Approve</button>
				</div>
			</div>
		</article>
	</template>
	<script src="/admin/app.js" defer></script>
</body>
</html>
